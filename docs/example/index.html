<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pergola Configurator</title>

<style>
html, body { margin:0; height:100%; font-family:Arial; }
body { display:flex; overflow:hidden; }
#ui {
  width:360px;
  padding:16px;
  background:#f4f4f4;
  overflow:auto;
  border-right:1px solid #ccc;
}
#viewer { flex:1; }

label {
  display:block;
  margin-top:10px;
  font-size:13px;
}

input[type="number"],
select {
  width:100%;
  padding:6px;
  box-sizing:border-box;
}

input[type="checkbox"] {
  width:auto;
  padding:0;
  margin:0 8px 0 0;
}

.toggle-row {
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.toggle-row label {
  display:inline;
  margin-top:0;
}

pre { background:white; padding:10px; font-size:12px; }

</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "three-csg-ts": "https://unpkg.com/three-csg-ts@3.2.0/lib/esm/index.js"
  }
}
</script>
</head>

<body>

<div id="ui">
<h1>Pergola Configurator</h1>
<h3>Parameters:</h3>

<label>Overall Width
<input id="pergolaWidth" type="number" min="96" max="240" value="190"></label>

<label>Overall Length
<input id="pergolaLength" type="number" min="96" max="288" value="190"></label>

<label>Post Height
<input id="postHeight" type="number" min="72" max="144" value="108"></label>

<label>Post Size
<input id="postSize" type="number" min="5.5" max="7.25" step="0.25" value="7.25"></label>

<label>Beam Height
<input id="beamHeight" type="number" min="5.5" max="11.25" step="0.25" value="7.25"></label>

<label>Number of Rafters
<input id="rafterCount" type="number" min="3" value="9"></label>

<label>Rafter Width
<input id="rafterWidth" type="number" min="1.5" max="5.5" step="0.5" value="3.5"></label>

<label>Rafter Height
<input id="rafterHeight" type="number" min="5.5" max="11.25" step="0.25" value="7.25"></label>

<label>Number of Purlins
<input id="purlinCount" type="number" min="3" value="7"></label>

<label>Purlin Width
<input id="purlinWidth" type="number" min="3" max="5" step="0.25" value="3"></label>

<label>Purlin Height
<input id="purlinHeight" type="number" min="1" max="3" step="0.25" value="1"></label>

<label>Brace Width
<input id="braceWidth" type="number" min="3.5" max="7.25" step="0.25" value="5.5"></label>

<label for="braceStyle">Brace Collection / Style</label>
<select name="braceCollection" id="braceCollection">
  <option value="Oxford">Oxford Collection</option>
  <option value="Woodside">Woodside Collection</option>
</select>

<label>End Cut Number (0 for square ends)
<input id="endCutNumber" type="number" min="0" max="10" step="1" value="4"></label>

<h3>BOM:</h3>
<pre id="bom"></pre>

<h3>Toggle Visibility:</h3>
<div class="toggle-row">
    <input type="checkbox" id="postVisibility" name="postVisibility" value="CHECKED" checked />
    <label for="postVisibility"> Posts</label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="frontBeamVisibility" name="frontBeamVisibility" value="CHECKED" checked />
    <label for="frontBeamVisibility"> Front Beams</label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="sideBeamVisibility" name="sideBeamVisibility" value="CHECKED" checked />
    <label for="sideBeamVisibility"> Side Beams</label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="rafterVisibility" name="rafterVisibility" value="CHECKED" checked />
    <label for="rafterVisibility"> Rafters</label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="purlinVisibility" name="purlinVisibility" value="CHECKED" checked />
    <label for="purlinVisibility"> Purlins</label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="braceVisibility" name="braceVisibility" value="CHECKED" checked />
    <label for="braceVisibility"> Braces</label>
  </div>

</div>

<div id="viewer"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSG } from "three-csg-ts";

const viewer = document.getElementById("viewer");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe0e0e0);

const camera = new THREE.PerspectiveCamera(50,1,0.1,5000);
camera.position.set(200,150,200);

const renderer = new THREE.WebGLRenderer({antialias:true});
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff,0.8));
const light = new THREE.DirectionalLight(0xffffff,5);
light.position.set(100,200,100);
scene.add(light);

const root = new THREE.Group();
scene.add(root);

const wood = new THREE.MeshStandardMaterial({color:0x8a5c31});
const Walnut = new THREE.MeshStandardMaterial({color:0x4f3720});
const metal = new THREE.MeshStandardMaterial({color:0x808080});
const outlineMaterial = new THREE.LineBasicMaterial({ color: 0x2b1a10 });

function resize(){
renderer.setSize(viewer.clientWidth, viewer.clientHeight);
camera.aspect = viewer.clientWidth/viewer.clientHeight;
camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

function clear(){
while(root.children.length){
root.remove(root.children[0]);
}
}

function get(id){ return parseFloat(document.getElementById(id).value); }

function build(){

clear();

const beamOverhang = 12;
const rafterOverhang = beamOverhang-0.5;
const purlinOverhang = 7.5;

const pergolaWidth = get("pergolaWidth");
const pergolaLength = get("pergolaLength");
const postHeight = get("postHeight");
const postSize = get("postSize");
const beamHeight = get("beamHeight");

const rafterCount = Math.max(3,get("rafterCount"));
const rafterW = get("rafterWidth");
const rafterH = get("rafterHeight");

const purlinCount = Math.max(3,get("purlinCount"));
const purlinW = get("purlinWidth");
const purlinH = get("purlinHeight");

const halfW = pergolaWidth/2;
const halfL = pergolaLength/2;

const beamY = postHeight + beamHeight/2;

// POSTS
const postPositions = [
[-halfW+beamOverhang+(postSize/2), -halfL+beamOverhang+(postSize/2)],
[ halfW-beamOverhang-(postSize/2), -halfL+beamOverhang+(postSize/2)],
[-halfW+beamOverhang+(postSize/2),  halfL-beamOverhang-(postSize/2)],
[ halfW-beamOverhang-(postSize/2),  halfL-beamOverhang-(postSize/2)]
];

for(const [x,z] of postPositions){
const post = new THREE.Mesh(
new THREE.BoxGeometry(postSize, postHeight, postSize),
wood
);
post.position.set(x, postHeight/2, z);

const postCheckboxElement = document.getElementById('postVisibility');
const postVisibilityBoolean = postCheckboxElement.checked;

if(postVisibilityBoolean){
  root.add(post);
}
}

// SIDE BEAMS

const beamDepth = postSize;

const notchDepth = 2*7.25/beamDepth;

for(const x of [-halfW+beamOverhang+(beamDepth/2), halfW-beamOverhang-(beamDepth/2)]){
const sideBeam = new THREE.Mesh(
new THREE.BoxGeometry(beamDepth, beamHeight, pergolaLength-((beamOverhang+beamDepth-notchDepth)*2)),
wood
);
sideBeam.position.set(x, beamY, 0);
if (x > 0){
	sideBeam.name = "sidebeam1";
}else{
	sideBeam.name = "sidebeam2";
}
root.add(sideBeam);
}

// FRONT BEAMS

//pull in side beams for boolean
const sideBeam1 = root.getObjectByName("sidebeam1");
const sideBeam2 = root.getObjectByName("sidebeam2");
sideBeam1.updateMatrix();
sideBeam2.updateMatrix();

for(const z of [-halfL+beamOverhang+(beamDepth/2), halfL-beamOverhang-(beamDepth/2)]){
const baseFrontBeam = new THREE.Mesh(
new THREE.BoxGeometry(pergolaWidth, beamHeight, beamDepth),
wood
);
baseFrontBeam.position.set(0, beamY, z);
baseFrontBeam.updateMatrix();

//subtract side beam to create notches
let beamCSG = CSG.fromMesh(baseFrontBeam);
beamCSG = beamCSG.subtract(CSG.fromMesh(sideBeam1));
beamCSG = beamCSG.subtract(CSG.fromMesh(sideBeam2));

//add end cuts
const leftCutter = createDecorativeEndCutCutter(beamHeight,beamDepth,"X","left");
const rightCutter = createDecorativeEndCutCutter(beamHeight,beamDepth,"X","right");

const leftCutterX = -pergolaWidth/2;
const leftCutterY = beamY-(beamHeight/2);
const leftCutterZ = z-(beamDepth/2)-0.25;

const rightCutterX = pergolaWidth/2;
const rightCutterY = beamY-(beamHeight/2);
const rightCutterZ = z+(beamDepth/2)+0.25;

leftCutter.position.set(leftCutterX,leftCutterY,leftCutterZ);
leftCutter.updateMatrix();
rightCutter.position.set(rightCutterX,rightCutterY,rightCutterZ);
rightCutter.updateMatrix();

beamCSG = beamCSG.subtract(CSG.fromMesh(leftCutter));
beamCSG = beamCSG.subtract(CSG.fromMesh(rightCutter));

//convert back to mesh
const cutFrontBeam = CSG.toMesh(beamCSG, new THREE.Matrix4(), wood);

cutFrontBeam.geometry.computeVertexNormals();
cutFrontBeam.userData.type = "frontBeam";

const frontBeamCheckboxElement = document.getElementById('frontBeamVisibility');
const frontBeamVisibilityBoolean = frontBeamCheckboxElement.checked;

if(frontBeamVisibilityBoolean){
  root.add(cutFrontBeam);
}
}

const sideBeamCheckboxElement = document.getElementById('sideBeamVisibility');
const sideBeamVisibilityBoolean = sideBeamCheckboxElement.checked;

if(!sideBeamVisibilityBoolean){
  root.remove(sideBeam1);
  root.remove(sideBeam2);
}

// RAFTERS (across width)
const spacing = (pergolaWidth-(rafterOverhang*2)-rafterW)/(rafterCount-1);

const rafterY = beamY + beamHeight/2 + rafterH/2;

for(let i=0;i<rafterCount;i++){
const x = -halfW+rafterOverhang+(rafterW/2) + i*spacing;

const baseRafter = new THREE.Mesh(
new THREE.BoxGeometry(rafterW, rafterH, pergolaLength),
wood
);

baseRafter.position.set(x, rafterY, 0);
baseRafter.updateMatrix();

//add end cuts
const leftCutter = createDecorativeEndCutCutter(rafterH,rafterW,"Z","left");
const rightCutter = createDecorativeEndCutCutter(rafterH,rafterW,"Z","right");

const leftCutterX = x-(rafterW/2)-0.25;
const leftCutterY = rafterY-(rafterH/2);
const leftCutterZ = pergolaLength/2;

const rightCutterX = x+(rafterW/2)+0.25;
const rightCutterY = rafterY-(rafterH/2);
const rightCutterZ = -pergolaLength/2;

leftCutter.position.set(leftCutterX,leftCutterY,leftCutterZ);
leftCutter.updateMatrix();
rightCutter.position.set(rightCutterX,rightCutterY,rightCutterZ);
rightCutter.updateMatrix();

let rafterCSG = CSG.fromMesh(baseRafter);

rafterCSG = rafterCSG.subtract(CSG.fromMesh(leftCutter));
rafterCSG = rafterCSG.subtract(CSG.fromMesh(rightCutter));

//convert back to mesh
const cutRafter = CSG.toMesh(rafterCSG, new THREE.Matrix4(), wood);

cutRafter.geometry.computeVertexNormals();

const rafterCheckboxElement = document.getElementById('rafterVisibility');
const rafterVisibilityBoolean = rafterCheckboxElement.checked;

if(rafterVisibilityBoolean){
  root.add(cutRafter);
}
}

// PURLINS (across length)
const purlinSpacing = (pergolaLength-(beamOverhang*2)-purlinW)/(purlinCount-1);

const purlinY = rafterY + rafterH/2 + purlinH/2;

for(let i=0;i<purlinCount;i++){
const z = -halfL+beamOverhang+(purlinW/2) + i*purlinSpacing;

const purlin = new THREE.Mesh(
new THREE.BoxGeometry(pergolaWidth-(beamOverhang*2)+(purlinOverhang*2), purlinH, purlinW),
wood
);

purlin.position.set(0, purlinY, z);

const purlinCheckboxElement = document.getElementById('purlinVisibility');
const purlinVisibilityBoolean = purlinCheckboxElement.checked;

if(purlinVisibilityBoolean){
  root.add(purlin);
}
}

// BRACES
const braceHeight = 24.5;
const braceProjection = 24.5;

for(const [x,z] of postPositions){

const braceProfile = new THREE.Shape();
switch(braceCollection.value){
  case "Oxford":
	//Oxford collectioon brace
	  braceProfile.moveTo(braceProjection, 0);
	  braceProfile.lineTo(braceProjection, -1.5);
	  //arc from (braceProjection, -1.5) to (1.5, -braceHeight), 40" radius
	  const arcX1 = braceProjection;
	  const arcY1 = -1.5;
	  const arcX2 = 1.5;
	  const arcY2 = -braceHeight;
	  const arcR = 40;
	  const arcDX = arcX2 - arcX1;
	  const arcDY = arcY2 - arcY1;
	  const arcD = Math.hypot(arcDX, arcDY);

      // midpoint
	  const arcMidX = (arcX1 + arcX2) / 2;
	  const arcMidY = (arcY1 + arcY2) / 2;

	  // distance from midpoint to center
	  const arcH = Math.sqrt(Math.max(0, arcR * arcR - (arcD / 2) * (arcD / 2)));

	  // perpendicular unit vector
	  const arcUX = -arcDY / arcD;
	  const arcUY = arcDX / arcD;

	  // two possible centers
	  const arcCenterX = arcMidX + arcUX * arcH; //alternate mx - ...
	  const arcCenterY = arcMidY + arcUY * arcH; //alternate my - ...

      const startAngle = Math.atan2(arcY1 - arcCenterY, arcX1 - arcCenterX);
      const endAngle = Math.atan2(arcY2 - arcCenterY, arcX2 - arcCenterX);
	  
	  braceProfile.absarc(
		arcCenterX,
		arcCenterY,
		arcR,
		startAngle,
		endAngle,
		false
	  );
	  
	  //continue profile
	  braceProfile.lineTo(0, -braceHeight);
	  braceProfile.lineTo(0, -(braceHeight-9.125));
	  braceProfile.lineTo(braceProjection-9.125, 0);
	  braceProfile.lineTo(braceProjection, 0);
    break;
  default:
	//Woodside collectioon brace
	  braceProfile.moveTo(braceProjection, 0);
	  braceProfile.lineTo(braceProjection, -1);
	  braceProfile.lineTo(1, -braceHeight);
	  braceProfile.lineTo(0, -braceHeight);
	  braceProfile.lineTo(0, -(braceHeight-6.75));
	  braceProfile.lineTo(braceProjection-6.75, 0);
	  braceProfile.lineTo(braceProjection, 0);
	  
}

  const geometry = new THREE.ExtrudeGeometry(braceProfile, {
    depth: braceWidth.value,
    bevelEnabled: false
  });
  const braceX = new THREE.Mesh(geometry, wood);
  const braceZ = new THREE.Mesh(geometry, wood);

  braceZ.rotation.y = Math.PI / 2;


  if (x > 0) {
    braceX.rotation.y += Math.PI;
	braceX.position.set(x-(postSize/2), postHeight, z+(braceWidth.value/2));
  }else{
    braceX.position.set(x+(postSize/2), postHeight, z-(braceWidth.value/2));
  }
  if (z < 0) {
	braceZ.rotation.y += Math.PI;
	braceZ.position.set(x+(braceWidth.value/2), postHeight, z+(postSize/2));
  }else{
    braceZ.position.set(x-(braceWidth.value/2), postHeight, z-(postSize/2));
  }

  braceX.updateMatrix();
  braceZ.updateMatrix();

const braceCheckboxElement = document.getElementById('braceVisibility');
const braceVisibilityBoolean = braceCheckboxElement.checked;

if(braceVisibilityBoolean){
  root.add(braceX);
  root.add(braceZ);
}
}

// BOM
document.getElementById("bom").textContent =
`Posts: (4) ${postSize}" x ${postSize}" x ${postHeight}"

Front Beams: (2) ${beamDepth}" x ${beamHeight}" x ${pergolaWidth}",
two #${endCutNumber.value} end cuts

Side Beams: (2) ${beamDepth}" x ${beamHeight}" x ${pergolaLength-((beamOverhang+beamDepth-notchDepth)*2)}", square ends

Rafters: (${rafterCount}) ${rafterW}" x ${rafterH}" x ${pergolaLength}",
two #${endCutNumber.value} end cuts

Purlins: (${purlinCount}) ${purlinH}" x ${purlinW}" x ${pergolaWidth-(beamOverhang*2)+(purlinOverhang*2)}", square ends

Braces: (8) ${braceCollection.value} Collection, ${braceHeight}" height x
${braceProjection}" projection x ${braceWidth.value}" width, pre-drilled`;

controls.target.set(0, postHeight/2, 0);

}

document.querySelectorAll("input").forEach(i=>i.addEventListener("input", build));

resize();
build();

function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}
animate();

//function that handles end cut profiles
function createDecorativeEndCutCutter(memberHeight, memberWidth, dimension, side){
  const shape = new THREE.Shape();

  const x0 = 0;
  const y0 = 0;
  let x1 = 0; // end cut length
  let y1 = 0; // end cut "height" (2" tip flat on a 7-1/4" beam would have an end cut height of 5-1/4")

//switch statement to define geometry based on end cut style
	switch (parseInt(endCutNumber.value)) {
		case 1:{
			//End cut 1
			const minimumMemberDimension = Math.min(memberHeight,memberWidth);
			const chamferLength = 0.875*minimumMemberDimension/3.5; // end cut length
			
			//make end cut block mockup
			const endCut1EndBlock = new THREE.Shape();
			
			endCut1EndBlock.moveTo(0, 0);
			endCut1EndBlock.lineTo(memberWidth, 0);
			endCut1EndBlock.lineTo(memberWidth, memberHeight);
			endCut1EndBlock.lineTo(0, memberHeight);
			endCut1EndBlock.lineTo(0, 0);
			
			const blockExtrusionDepth = chamferLength + 1;
			
			const endCut1BlockGeom = new THREE.ExtrudeGeometry(endCut1EndBlock, {
				depth: blockExtrusionDepth,
				bevelEnabled: true,
				bevelThickness: chamferLength,
				bevelSize: chamferLength,
				bevelOffset: -chamferLength,
				bevelSegments: 1
				});

			const endCut1BlockMesh = new THREE.Mesh(endCut1BlockGeom, wood);

			//make cutter
			const endCut1Cutter = new THREE.Shape();
			
			endCut1Cutter.moveTo(-0.25, -0.25);
			endCut1Cutter.lineTo(memberWidth + 0.25, -0.25);
			endCut1Cutter.lineTo(memberWidth + 0.25, memberHeight + 0.25);
			endCut1Cutter.lineTo(-0.25, memberHeight + 0.25);
			endCut1Cutter.lineTo(-0.25, -0.25);
			
			const endCut1CutterGeom = new THREE.ExtrudeGeometry(endCut1Cutter, {
				depth: blockExtrusionDepth,
				bevelEnabled: false
				});

			const endCut1CutterMesh = new THREE.Mesh(endCut1CutterGeom, metal);
			
			const endCut1CutterGeom2 = new THREE.ExtrudeGeometry(endCut1Cutter, {
				depth: blockExtrusionDepth,
				bevelEnabled: false
				});

			const endCut1CutterMesh2 = new THREE.Mesh(endCut1CutterGeom2, metal);
			
			endCut1CutterMesh2.rotation.y += Math.PI;
			endCut1CutterMesh2.position.set(memberWidth,0,0);
			endCut1CutterMesh2.updateMatrix();			
			
			endCut1BlockMesh.rotation.y += Math.PI;			
			endCut1BlockMesh.position.set(memberWidth+0.25,0,-chamferLength);
			endCut1BlockMesh.updateMatrix();
			
			let endCut1CutterCSG = CSG.fromMesh(endCut1CutterMesh);

			endCut1CutterCSG = endCut1CutterCSG.union(CSG.fromMesh(endCut1CutterMesh2));
			endCut1CutterCSG = endCut1CutterCSG.subtract(CSG.fromMesh(endCut1BlockMesh));
			
			//convert back to mesh
			let endCut1BooleanCutter = CSG.toMesh(endCut1CutterCSG, new THREE.Matrix4(), metal);
			endCut1BooleanCutter.rotation.y += Math.PI * 3 / 2;
			
			// Extrusion is along local X axis, if needed to be along Z axis, rotation is needed
			if (dimension === "Z"){
			  endCut1BooleanCutter.rotation.y += Math.PI / 2;
			}
			if (side === "right") {
			  endCut1BooleanCutter.rotation.y += Math.PI;
			}
			
			endCut1BooleanCutter.updateMatrix();
			
			return endCut1BooleanCutter;

			break;}
		case 2:{
			//End cut 2
			x1 = 10*memberHeight/7.25; // end cut length
			y1 = memberHeight-(2*memberHeight/7.25); // end cut "height"
			
			shape.moveTo(x0, y1);
			shape.lineTo(x0, y0);
			shape.lineTo(x1, y0);
			shape.lineTo(x0, y1);
			
			break;}
		case 3:{
			//End cut 3
			x1 = 10*memberHeight/7.25; // end cut length
			y1 = memberHeight-(2*memberHeight/7.25); // end cut "height"
			const y2 = 1.375*memberHeight/7.25;
			
			shape.moveTo(x0, y1);
			shape.lineTo(x0, y0);
			shape.lineTo(x1, y0);
			shape.lineTo(x1, y2);
			shape.lineTo(x0, y1);
			
			break;}
		case 4:{
			//End cut 4
			x1 = 10*memberHeight/7.25; // end cut length
			y1 = memberHeight-(2*memberHeight/7.25); // end cut "height"
			
			shape.moveTo(x0, y1);
			shape.lineTo(x0, y0);
			shape.lineTo(x1, y0);
			
			const arcX1 = x1;
			const arcY1 = y0;
			const arcX2 = x0;
			const arcY2 = y1;
			
			const centerX = x0;
			// Solve for centerY by equating distances from center to both endpoints.
			const centerY =
			(
			(arcX1 - centerX) ** 2 -
			(arcX2 - centerX) ** 2 +
			arcY1 ** 2 -
			arcY2 ** 2
			) / (2 * (arcY1 - arcY2));

			// Radius from either endpoint
			const arcRadius = Math.hypot(arcX1 - centerX, arcY1 - centerY);

			// Angles in radians
			const startAngle = Math.atan2(arcY1 - centerY, arcX1 - centerX);
			const endAngle = Math.atan2(arcY2 - centerY, arcX2 - centerX);
			
			shape.absarc(
				centerX,
				centerY,
				arcRadius,
				startAngle,
				endAngle,
				false
			);
			
			break;}
		case 5:{
			//End cut 5
			x1 = 6*memberHeight/7.25; // end cut length
			y1 = memberHeight-(2.5*memberHeight/7.25); // end cut "height"
			
			shape.moveTo(x0, y1);
			shape.lineTo(x0, y0);
			shape.lineTo(x1, y0);
			
			const arcX1 = x1;
			const arcY1 = y0;
			const arcX2 = x0;
			const arcY2 = y1;
			
			const centerX = x0;
			// Solve for centerY by equating distances from center to both endpoints.
			const centerY =
			(
			(arcX1 - centerX) ** 2 -
			(arcX2 - centerX) ** 2 +
			arcY1 ** 2 -
			arcY2 ** 2
			) / (2 * (arcY1 - arcY2));

			// Radius from either endpoint
			const arcRadius = Math.hypot(arcX1 - centerX, arcY1 - centerY);

			// Angles in radians
			const startAngle = Math.atan2(arcY1 - centerY, arcX1 - centerX);
			const endAngle = Math.atan2(arcY2 - centerY, arcX2 - centerX);
			
			shape.absarc(
				centerX,
				centerY,
				arcRadius,
				startAngle,
				endAngle,
				false
			);
			
			break;}
		case 6:{
			//End cut 6
			x1 = 6.875*memberHeight/7.25; // end cut length
			y1 = memberHeight-(2*memberHeight/7.25); // end cut "height"
			const x2 = 5.625*memberHeight/7.25;
			const y2 = 2*memberHeight/7.25;
			
			shape.moveTo(x0, y1);
